<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ── Top navigation ───────────────────────────────────── -->
<header class="topbar">
  <div class="topbar-brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
    </svg>
    <span class="brand-name">Team Dashboard</span>
    <span class="brand-dot"></span>
  </div>

  <nav class="tab-nav" id="tab-nav" style="display:none">
    <button class="tab-btn active" data-tab="overview" onclick="switchTab('overview')">Overview</button>
    <button class="tab-btn" data-tab="board"    onclick="switchTab('board')">Board</button>
    <button class="tab-btn" data-tab="repos"    onclick="switchTab('repos')">Repos</button>
  </nav>

  <div class="topbar-right">
    <span id="last-updated" class="last-updated" style="display:none"></span>
    <button class="btn" id="load-btn" onclick="loadDashboard()" style="display:none">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.18-6.58"/></svg>
      Refresh
    </button>
    <button class="btn-icon" id="settings-btn" onclick="toggleSettings()" title="Settings" style="display:none">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <!-- Settings panel (inline before first connect, dropdown after) -->
  <div id="settings-panel" class="settings-panel">
    <input id="pat-input" type="password" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off" />
    <input id="org-input" type="text" placeholder="org or username" />
    <button class="btn" id="connect-btn" onclick="loadDashboard()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.18-6.58"/></svg>
      Connect
    </button>
  </div>
</header>

<!-- ── Main ─────────────────────────────────────────────── -->
<main class="main">

  <!-- Loading / error status -->
  <div id="status-msg"></div>

  <!-- Empty / not-connected state -->
  <div id="empty-state" class="empty-state">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.25;margin-bottom:16px">
      <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
    <p>Connect your GitHub account to load the team dashboard</p>
    <small>Token needs <code style="color:var(--purple)">repo</code> + <code style="color:var(--purple)">read:org</code> scopes</small>
  </div>

  <!-- ── Overview tab ──────────────────────────────────── -->
  <div id="tab-overview" class="tab-content">
    <div id="team-row" class="team-row"></div>
    <div id="summary-grid" class="summary-grid"></div>
  </div>

  <!-- ── Board tab ─────────────────────────────────────── -->
  <div id="tab-board" class="tab-content" style="display:none">
    <div class="board-toolbar">
      <div class="board-search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="board-search" type="text" placeholder="Search tasks, PRs, commits…" oninput="filterBoard()" />
      </div>
      <div class="board-filters">
        <div class="board-filter-row">
          <span class="board-filter-label">Repo</span>
          <div id="board-repo-filter" class="board-repo-filter"></div>
        </div>
        <div class="board-filter-row">
          <span class="board-filter-label">Person</span>
          <div id="board-person-filter" class="board-repo-filter"></div>
        </div>
      </div>
    </div>
    <div id="board" class="board"></div>
  </div>

  <!-- ── Repos tab ─────────────────────────────────────── -->
  <div id="tab-repos" class="tab-content" style="display:none">
    <div id="filter-bar" class="filter-bar">
      <button class="filter-btn active" data-filter="all"    onclick="setFilter('all')">All</button>
      <button class="filter-btn"        data-filter="active" onclick="setFilter('active')">Active</button>
      <button class="filter-btn"        data-filter="idle"   onclick="setFilter('idle')">Idle</button>
      <button class="filter-btn"        data-filter="stale"  onclick="setFilter('stale')">Stale</button>
      <span id="filter-count" class="filter-count"></span>
      <span class="filter-legend">
        <span class="legend-dot" style="background:var(--green)"></span>Active &lt; 2d
        <span class="legend-sep">·</span>
        <span class="legend-dot" style="background:var(--orange)"></span>Idle &lt; 7d
        <span class="legend-sep">·</span>
        <span class="legend-dot" style="background:var(--red)"></span>Stale ≥ 7d
      </span>
    </div>
    <div id="repo-list" class="repo-list"></div>
  </div>

</main>

<script>
document.addEventListener('DOMContentLoaded', loadFromStorage);

// ── Constants ──────────────────────────────────────────────
const AVATAR_COLORS = [
  ['#1f4b8e','#58a6ff'], ['#0f3d2c','#3fb950'], ['#4a1d0f','#d29922'],
  ['#3b1a45','#bc8cff'], ['#1d3a4a','#56d3f5'], ['#4a2020','#f85149'],
  ['#1a3a2a','#56d364']
];

const LANG_COLORS = {
  JavaScript:'#f1e05a', TypeScript:'#3178c6', PHP:'#4f5d95',
  Python:'#3572a5', Ruby:'#701516', Go:'#00add8', Rust:'#dea584',
  CSS:'#563d7c', HTML:'#e34c26', Shell:'#89e051', Java:'#b07219',
  'C#':'#178600', 'C++':'#f34b7d', Swift:'#f05138', Kotlin:'#a97bff',
};

// ── State ──────────────────────────────────────────────────
let allDetails        = [];
let activeFilter      = 'all';
let activeTab         = 'overview';
let boardRepoFilter   = 'all';
let boardPersonFilter = 'all';
let lastRefreshed     = null;
let autoRefreshTimer  = null;
let lastUpdatedTimer  = null;
let settingsOpen      = false;

// ── Helpers ────────────────────────────────────────────────
function initials(name) {
  if (!name) return '?';
  return name.split(/[\s\-_]/).filter(Boolean).map(p => p[0]).join('').toUpperCase().slice(0,2);
}

function timeAgo(d) {
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 60)     return 'just now';
  if (s < 3600)   return Math.floor(s/60) + 'm ago';
  if (s < 86400)  return Math.floor(s/3600) + 'h ago';
  if (s < 604800) return Math.floor(s/86400) + 'd ago';
  return Math.floor(s/604800) + 'w ago';
}

function formatDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

function repoStatus(pushedAt) {
  const days = (Date.now() - new Date(pushedAt)) / 86400000;
  if (days < 2) return 'active';
  if (days < 7) return 'idle';
  return 'stale';
}

function statusBadge(pushedAt) {
  const s = repoStatus(pushedAt);
  const labels = { active:'Active', idle:'Idle', stale:'Stale' };
  return `<span class="badge badge-${s}"><span class="badge-dot"></span>${labels[s]}</span>`;
}

function langBadge(language) {
  if (!language) return '';
  const color = LANG_COLORS[language] || '#8b949e';
  return `<span class="lang-badge"><span class="lang-dot" style="background:${color}"></span>${esc(language)}</span>`;
}

function repoBadge(repoName, colorIdx) {
  const [,fg] = AVATAR_COLORS[colorIdx % 7];
  return `<span class="repo-pill" style="color:${fg};border-color:${fg}20;background:${fg}12">${esc(repoName)}</span>`;
}

function svg(path, w=12) {
  return `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
}

const SVG_PR     = svg('<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" y1="9" x2="6" y2="21"/>');
const SVG_ISSUE  = svg('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>');
const SVG_COMMIT = svg('<circle cx="12" cy="12" r="3"/><line x1="3" y1="12" x2="9" y2="12"/><line x1="15" y1="12" x2="21" y2="12"/>');
const SVG_WIP    = svg('<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>');
const SVG_BLOCK  = svg('<circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>');
const SVG_SEARCH = svg('<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>');

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── GitHub API ─────────────────────────────────────────────
async function ghFetch(url, token) {
  const r = await fetch(url, {
    headers: { Authorization:`Bearer ${token}`, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' }
  });
  if (!r.ok) throw new Error(`GitHub ${r.status}: ${url.split('/').slice(-2).join('/')}`);
  return r.json();
}

async function fetchAllRepos(org, token) {
  let page = 1, all = [];
  while (true) {
    let batch;
    try {
      batch = await ghFetch(`https://api.github.com/orgs/${org}/repos?per_page=100&sort=pushed&page=${page}`, token);
    } catch {
      batch = await ghFetch(`https://api.github.com/users/${org}/repos?per_page=100&sort=pushed&page=${page}`, token);
    }
    all = all.concat(batch);
    if (batch.length < 100) break;
    page++;
  }
  return all;
}

// ── Storage ────────────────────────────────────────────────
function saveToStorage() {
  const t = document.getElementById('pat-input').value.trim();
  const o = document.getElementById('org-input').value.trim();
  if (t) localStorage.setItem('gh_pat', t);
  if (o) localStorage.setItem('gh_org', o);
}

function loadFromStorage() {
  const t = localStorage.getItem('gh_pat');
  const o = localStorage.getItem('gh_org');
  if (t) document.getElementById('pat-input').value = t;
  if (o) document.getElementById('org-input').value = o;
  if (t && o) loadDashboard();
}

// ── Settings panel ─────────────────────────────────────────
function toggleSettings() {
  settingsOpen = !settingsOpen;
  document.getElementById('settings-panel').classList.toggle('open', settingsOpen);
  document.getElementById('settings-btn').classList.toggle('active', settingsOpen);
}

function collapseSettings() {
  settingsOpen = false;
  const p = document.getElementById('settings-panel');
  p.classList.remove('open');
  p.classList.add('dropdown');
  document.getElementById('settings-btn').classList.remove('active');
  document.getElementById('settings-btn').style.display = 'flex';
  document.getElementById('load-btn').style.display     = 'flex';
}

// ── Tab switching ──────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  document.getElementById(`tab-${tab}`).style.display = 'block';
}

// ── Auto-refresh ───────────────────────────────────────────
function startAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(loadDashboard, 5 * 60 * 1000);
}

function tickLastUpdated() {
  if (lastUpdatedTimer) clearInterval(lastUpdatedTimer);
  lastUpdatedTimer = setInterval(() => {
    if (!lastRefreshed) return;
    document.getElementById('last-updated').textContent = 'Updated ' + timeAgo(lastRefreshed);
  }, 30000);
}

// ── Load ───────────────────────────────────────────────────
async function loadDashboard() {
  const token = document.getElementById('pat-input').value.trim();
  const org   = document.getElementById('org-input').value.trim();
  if (!token || !org) { setStatus('↳ enter token and org to continue'); return; }
  saveToStorage();

  const spinSvg = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation:spin .8s linear infinite"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.18-6.58"/></svg>`;
  document.getElementById('load-btn').innerHTML    = spinSvg + ' Refreshing';
  document.getElementById('connect-btn').innerHTML = spinSvg + ' Loading';
  document.getElementById('load-btn').disabled    = true;
  document.getElementById('connect-btn').disabled = true;

  document.getElementById('empty-state').style.display = 'none';
  setStatus('↳ fetching repositories…');

  try {
    const repos = await fetchAllRepos(org, token);
    if (!repos.length) { setStatus('↳ no repositories found.'); resetBtn(); return; }

    setStatus(`↳ found ${repos.length} repos — loading details…`);

    allDetails = await Promise.all(repos.map(async (repo, i) => {
      try {
        const [commits, pulls, issues] = await Promise.all([
          ghFetch(`https://api.github.com/repos/${org}/${repo.name}/commits?per_page=10`, token).catch(() => []),
          ghFetch(`https://api.github.com/repos/${org}/${repo.name}/pulls?state=open&per_page=10`, token).catch(() => []),
          ghFetch(`https://api.github.com/repos/${org}/${repo.name}/issues?state=open&per_page=10`, token).catch(() => [])
        ]);
        return { repo, lastCommit: commits[0] || null, commits, pulls, issues: issues.filter(x => !x.pull_request), colorIdx: i % 7 };
      } catch {
        return { repo, lastCommit: null, pulls: [], issues: [], colorIdx: i % 7 };
      }
    }));

    lastRefreshed = new Date();
    const lu = document.getElementById('last-updated');
    lu.style.display = 'inline';
    lu.textContent   = 'Updated just now';

    renderOverview(allDetails);
    renderBoard(allDetails);
    renderRepos(allDetails);

    setStatus('');
    document.getElementById('tab-nav').style.display = 'flex';
    switchTab(activeTab);
    collapseSettings();
    startAutoRefresh();
    tickLastUpdated();
  } catch (e) {
    setStatus('↳ error: ' + e.message);
  }

  resetBtn();
}

function resetBtn() {
  const refreshSvg = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.18-6.58"/></svg>`;
  document.getElementById('load-btn').innerHTML    = refreshSvg + ' Refresh';
  document.getElementById('connect-btn').innerHTML = refreshSvg + ' Connect';
  document.getElementById('load-btn').disabled    = false;
  document.getElementById('connect-btn').disabled = false;
}

function setStatus(msg) {
  document.getElementById('status-msg').textContent = msg;
}

// ── Overview tab ───────────────────────────────────────────
function renderOverview(details) {
  // Team row
  const teamEl = document.getElementById('team-row');
  teamEl.innerHTML = details.map(({ repo, lastCommit, colorIdx }) => {
    const [bg, fg] = AVATAR_COLORS[colorIdx];
    const name     = lastCommit?.commit?.author?.name || lastCommit?.author?.login || 'Unknown';
    const s        = repoStatus(repo.pushed_at);
    const dotColor = { active:'var(--green)', idle:'var(--orange)', stale:'var(--red)' }[s];
    return `
      <div class="team-card" onclick="switchTab('repos')">
        <div class="team-avatar-wrap">
          <span class="team-avatar" style="background:${bg};color:${fg}">${initials(name)}</span>
          <span class="team-status-dot" style="background:${dotColor}"></span>
        </div>
        <span class="team-name">${esc(name.split(' ')[0])}</span>
        <span class="team-repo">${esc(repo.name)}</span>
      </div>`;
  }).join('');

  // Summary cards
  const totalPRs    = details.reduce((s, d) => s + d.pulls.length, 0);
  const totalIssues = details.reduce((s, d) => s + d.issues.length, 0);
  const active      = details.filter(d => repoStatus(d.repo.pushed_at) === 'active').length;
  const inProgress  = details.reduce((s, d) => s + d.issues.filter(i =>
    (i.labels||[]).some(l => ['in-progress','in progress'].includes(l.name.toLowerCase()))
  ).length, 0);
  const stalePRs    = details.reduce((s, d) => s + d.pulls.filter(p =>
    (Date.now() - new Date(p.created_at)) > 2 * 86400000
  ).length, 0);
  const blocked     = details.reduce((s, d) => s + d.issues.filter(i =>
    (i.labels||[]).some(l => l.name.toLowerCase() === 'blocked')
  ).length, 0);

  const grid = document.getElementById('summary-grid');
  grid.innerHTML = `
    <div class="metric-card" onclick="switchTab('repos')" style="cursor:pointer">
      <span class="metric-label">Repositories</span>
      <span class="metric-value">${details.length}</span>
      <span class="metric-sub">${active} active today</span>
    </div>
    <div class="metric-card" onclick="switchTab('board')" style="cursor:pointer">
      <span class="metric-label">Open tasks</span>
      <span class="metric-value blue">${totalIssues + totalPRs}</span>
      <span class="metric-sub">${totalIssues} issues · ${totalPRs} PRs</span>
    </div>
    <div class="metric-card" onclick="switchTab('board')" style="cursor:pointer">
      <span class="metric-label">In progress</span>
      <span class="metric-value orange">${inProgress}</span>
      <span class="metric-sub">of ${totalIssues} issues</span>
    </div>
    <div class="metric-card" onclick="switchTab('board')" style="cursor:pointer">
      <span class="metric-label">Waiting review</span>
      <span class="metric-value purple">${totalPRs}</span>
      <span class="metric-sub">${stalePRs > 0 ? `<span style="color:var(--red)">${stalePRs} waiting 2d+</span>` : 'all recent'}</span>
    </div>
    <div class="metric-card" onclick="switchTab('board')" style="cursor:pointer">
      <span class="metric-label">Blocked</span>
      <span class="metric-value ${blocked > 0 ? 'red' : 'green'}">${blocked}</span>
      <span class="metric-sub">label: blocked</span>
    </div>
  `;
}

// ── Board tab ──────────────────────────────────────────────
function renderBoard(details) {
  // Repo filter pills
  const filterEl = document.getElementById('board-repo-filter');
  filterEl.innerHTML = `<button class="repo-filter-btn active" data-repo="all" onclick="setBoardFilter('all')">All repos</button>` +
    details.map(({ repo, colorIdx }) => {
      const [,fg] = AVATAR_COLORS[colorIdx];
      return `<button class="repo-filter-btn" data-repo="${esc(repo.name)}" onclick="setBoardFilter('${esc(repo.name)}')" style="--pill-color:${fg}">${esc(repo.name)}</button>`;
    }).join('');

  // Person filter pills — collect unique assignees + PR authors
  const personSet = new Set();
  details.forEach(({ pulls, issues: iss }) => {
    iss.forEach(issue => {
      (issue.assignees || []).forEach(a => { if (a.login) personSet.add(a.login); });
      if (issue.assignee?.login) personSet.add(issue.assignee.login);
    });
    pulls.forEach(pr => {
      if (pr.user?.login) personSet.add(pr.user.login);
      (pr.assignees || []).forEach(a => { if (a.login) personSet.add(a.login); });
    });
  });
  const personEl = document.getElementById('board-person-filter');
  personEl.innerHTML = `<button class="repo-filter-btn active" data-person="all" onclick="setPersonFilter('all')">All people</button>` +
    [...personSet].map(login =>
      `<button class="repo-filter-btn" data-person="${esc(login)}" onclick="setPersonFilter('${esc(login)}')">${esc(login)}</button>`
    ).join('');

  drawBoard(details, '');
}

function setBoardFilter(repo) {
  boardRepoFilter = repo;
  document.querySelectorAll('[data-repo]').forEach(b => b.classList.toggle('active', b.dataset.repo === repo));
  filterBoard();
}

function setPersonFilter(person) {
  boardPersonFilter = person;
  document.querySelectorAll('[data-person]').forEach(b => b.classList.toggle('active', b.dataset.person === person));
  filterBoard();
}

function filterBoard() {
  const q = (document.getElementById('board-search')?.value || '').toLowerCase();
  drawBoard(allDetails, q);
}

function matchesPerson(item, type) {
  if (boardPersonFilter === 'all') return true;
  if (type === 'issue') {
    return item.assignee?.login === boardPersonFilter ||
           (item.assignees || []).some(a => a.login === boardPersonFilter);
  }
  if (type === 'pr') {
    return item.user?.login === boardPersonFilter ||
           (item.assignees || []).some(a => a.login === boardPersonFilter);
  }
  if (type === 'commit') {
    return item.author?.login === boardPersonFilter ||
           item.commit?.author?.name === boardPersonFilter;
  }
  return true;
}

function drawBoard(details, q) {
  const filtered = boardRepoFilter === 'all' ? details : details.filter(d => d.repo.name === boardRepoFilter);
  const cutoff   = Date.now() - 7 * 24 * 3600 * 1000; // last 7 days for Shipped

  const backlog    = [];
  const inProgress = [];
  const blocked    = [];
  const prs        = [];
  const shipped    = [];

  filtered.forEach(({ repo, commits: allCommits, pulls, issues: iss, colorIdx }) => {
    iss.forEach(issue => {
      if (q && !issue.title.toLowerCase().includes(q) && !repo.name.toLowerCase().includes(q)) return;
      if (!matchesPerson(issue, 'issue')) return;
      const labels = (issue.labels || []).map(l => l.name.toLowerCase());
      if (labels.includes('blocked')) {
        blocked.push({ item: issue, repo, colorIdx, type: 'issue' });
      } else if (labels.includes('in-progress') || labels.includes('in progress')) {
        inProgress.push({ item: issue, repo, colorIdx, type: 'issue' });
      } else {
        backlog.push({ item: issue, repo, colorIdx, type: 'issue' });
      }
    });
    pulls.forEach(pr => {
      if (q && !pr.title.toLowerCase().includes(q) && !repo.name.toLowerCase().includes(q)) return;
      if (!matchesPerson(pr, 'pr')) return;
      prs.push({ item: pr, repo, colorIdx, type: 'pr' });
    });
    (allCommits || []).forEach(commit => {
      const date = new Date(commit.commit?.author?.date);
      if (date < cutoff) return;
      const msg = commit.commit?.message?.split('\n')[0] || '';
      if (q && !msg.toLowerCase().includes(q) && !repo.name.toLowerCase().includes(q)) return;
      if (!matchesPerson(commit, 'commit')) return;
      shipped.push({ item: commit, repo, colorIdx, type: 'commit' });
    });
  });

  // Sort shipped newest first
  shipped.sort((a, b) => new Date(b.item.commit?.author?.date) - new Date(a.item.commit?.author?.date));

  const board = document.getElementById('board');
  const cols = [
    boardColumn('Backlog',     SVG_ISSUE,  backlog,    'col-backlog',    'var(--blue)'),
    boardColumn('In Progress', SVG_WIP,    inProgress, 'col-inprogress', 'var(--orange)'),
    blocked.length ? boardColumn('Blocked', SVG_BLOCK, blocked, 'col-blocked', 'var(--red)') : '',
    boardColumn('In Review',   SVG_PR,     prs,        'col-prs',        'var(--purple)'),
    boardColumn('Shipped',     SVG_COMMIT, shipped,    'col-shipped',    'var(--green)'),
  ].filter(Boolean);

  board.style.gridTemplateColumns = `repeat(${cols.length}, 1fr)`;
  board.innerHTML = cols.join('');
}

function boardColumn(title, icon, items, id, accentColor) {
  const cards = items.length
    ? items.map(buildTaskCard).join('')
    : `<div class="board-empty">No items</div>`;

  return `
    <div class="board-col" id="${id}">
      <div class="board-col-header" style="--accent:${accentColor}">
        <span class="board-col-icon">${icon}</span>
        <span class="board-col-title">${title}</span>
        <span class="board-col-count">${items.length}</span>
      </div>
      <div class="board-col-body">${cards}</div>
    </div>`;
}

function buildTaskCard({ item, repo, colorIdx, type }) {
  const [avatarBg, avatarFg] = AVATAR_COLORS[colorIdx];

  if (type === 'issue') {
    const author  = item.user?.login || '—';
    const date    = item.created_at;
    const labels  = (item.labels || []).slice(0, 3).map(l =>
      `<span class="label-pill" style="background:#${l.color}22;color:#${l.color};border-color:#${l.color}44">${esc(l.name)}</span>`
    ).join('');
    return `
      <a class="task-card" href="${item.html_url}" target="_blank" rel="noopener">
        <div class="task-card-top">
          ${repoBadge(repo.name, colorIdx)}
          <span class="task-number">#${item.number}</span>
        </div>
        <div class="task-title">${esc(item.title)}</div>
        ${labels ? `<div class="task-labels">${labels}</div>` : ''}
        <div class="task-footer">
          <span class="avatar sm" style="background:${avatarBg};color:${avatarFg}">${initials(author)}</span>
          <span class="task-author">${esc(author)}</span>
          <span class="task-date">${timeAgo(date)} · ${formatDate(date)}</span>
        </div>
      </a>`;
  }

  if (type === 'pr') {
    const author   = item.user?.login || '—';
    const date     = item.created_at;
    const isDraft  = item.draft;
    const ageDays  = (Date.now() - new Date(date)) / 86400000;
    const ageClass = ageDays > 5 ? 'task-card--old' : ageDays > 2 ? 'task-card--warn' : '';
    const ageBadge = ageDays > 2
      ? `<span class="age-badge ${ageDays > 5 ? 'age-badge--old' : 'age-badge--warn'}">${Math.floor(ageDays)}d waiting</span>`
      : '';
    const fromBranch = item.head?.ref || '';
    const toBranch   = item.base?.ref || '';
    return `
      <a class="task-card ${ageClass}" href="${item.html_url}" target="_blank" rel="noopener">
        <div class="task-card-top">
          ${repoBadge(repo.name, colorIdx)}
          <span class="task-number">#${item.number}</span>
          ${isDraft ? `<span class="draft-badge">Draft</span>` : ''}
          ${ageBadge}
        </div>
        <div class="task-title">${esc(item.title)}</div>
        ${fromBranch ? `<div class="branch-flow"><span class="branch-name">${esc(fromBranch)}</span><span class="branch-arrow">→</span><span class="branch-name branch-target">${esc(toBranch)}</span></div>` : ''}
        <div class="task-footer">
          <span class="avatar sm" style="background:${avatarBg};color:${avatarFg}">${initials(author)}</span>
          <span class="task-author">${esc(author)}</span>
          <span class="task-date">${timeAgo(date)} · ${formatDate(date)}</span>
        </div>
      </a>`;
  }

  if (type === 'commit') {
    const author  = item.commit?.author?.name || item.author?.login || '—';
    const date    = item.commit?.author?.date;
    const msg     = item.commit?.message?.split('\n')[0] || '';
    const sha     = item.sha?.slice(0, 7) || '';
    return `
      <a class="task-card" href="${item.html_url}" target="_blank" rel="noopener">
        <div class="task-card-top">
          ${repoBadge(repo.name, colorIdx)}
          <span class="task-number task-sha">${sha}</span>
        </div>
        <div class="task-title">${esc(msg)}</div>
        <div class="task-footer">
          <span class="avatar sm" style="background:${avatarBg};color:${avatarFg}">${initials(author)}</span>
          <span class="task-author">${esc(author)}</span>
          <span class="task-date">${timeAgo(date)} · ${formatDate(date)}</span>
        </div>
      </a>`;
  }

  return '';
}

// ── Repos tab ──────────────────────────────────────────────
function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  applyFilter(f);
}

function applyFilter(f) {
  const filtered = f === 'all' ? allDetails : allDetails.filter(d => repoStatus(d.repo.pushed_at) === f);
  document.getElementById('filter-count').textContent =
    f === 'all' ? `${filtered.length} repos` : `${filtered.length} of ${allDetails.length}`;
  renderRepoCards(filtered);
}

function renderRepos(details) {
  applyFilter(activeFilter);
}

function renderRepoCards(details) {
  const list = document.getElementById('repo-list');
  list.innerHTML = '';

  if (!details.length) {
    list.innerHTML = `<div class="board-empty" style="padding:40px;text-align:center">No ${activeFilter} repositories found.</div>`;
    return;
  }

  details.forEach(({ repo, lastCommit, pulls, issues, colorIdx }) => {
    const [avatarBg, avatarFg] = AVATAR_COLORS[colorIdx];
    const committer  = lastCommit?.commit?.author?.name || lastCommit?.author?.login || '—';
    const commitMsg  = lastCommit?.commit?.message?.split('\n')[0] || 'No commits yet';
    const commitDate = lastCommit?.commit?.author?.date;
    const commitTime = commitDate ? `${timeAgo(commitDate)} · ${formatDate(commitDate)}` : '—';
    const pushedTime = `${timeAgo(repo.pushed_at)} · ${formatDate(repo.pushed_at)}`;

    const prRows = pulls.length
      ? pulls.slice(0,3).map(p => `<div class="item-line">${SVG_PR}<span>${esc(p.title)}</span></div>`).join('')
      : `<span class="empty-line">No open PRs</span>`;

    const issueRows = issues.length
      ? issues.slice(0,3).map(i => `<div class="item-line">${SVG_ISSUE}<span>${esc(i.title)}</span></div>`).join('')
      : `<span class="empty-line">No open issues</span>`;

    const card = document.createElement('div');
    card.className = 'repo-card';
    card.dataset.repo = repo.name;
    card.innerHTML = `
      <div class="repo-header">
        <div>
          <div class="repo-name-row">
            <svg class="repo-icon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            <a class="repo-name" href="${repo.html_url}" target="_blank" rel="noopener">${esc(repo.name)}</a>
            ${langBadge(repo.language)}
          </div>
          ${repo.description ? `<div class="repo-desc" title="${esc(repo.description)}">${esc(repo.description)}</div>` : ''}
        </div>
        <div class="repo-meta">
          ${statusBadge(repo.pushed_at)}
          <span class="time-label">${pushedTime}</span>
        </div>
      </div>
      <div class="repo-details">
        <div class="detail-box">
          <div class="detail-title">${SVG_COMMIT} Last commit</div>
          <div class="commit-row">
            <span class="avatar" style="background:${avatarBg};color:${avatarFg}">${initials(committer)}</span>
            <span class="commit-author">${esc(committer)}</span>
            <span class="commit-time">${commitTime}</span>
          </div>
          <div class="commit-msg">${esc(commitMsg)}</div>
        </div>
        <div class="detail-box">
          <div class="detail-title">${SVG_PR} Open PRs <span style="color:var(--blue);margin-left:2px">${pulls.length}</span></div>
          ${prRows}
        </div>
        <div class="detail-box">
          <div class="detail-title">${SVG_ISSUE} Issues <span style="color:var(--orange);margin-left:2px">${issues.length}</span></div>
          ${issueRows}
        </div>
      </div>`;
    list.appendChild(card);
  });
}
</script>
