<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Dashboard — GitHub Org</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Top navigation bar -->
<header class="topbar">
  <div class="topbar-brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
    </svg>
    <span class="brand-name">Team Dashboard</span>
    <span class="brand-dot"></span>
  </div>

  <div class="topbar-controls">
    <input id="pat-input" type="password" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off" />
    <input id="org-input" type="text" placeholder="org-name" />
    <button class="btn" id="load-btn" onclick="loadDashboard()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.18-6.58"/></svg>
      Load
    </button>
  </div>
</header>

<!-- Main content -->
<main class="main">
  <div id="summary-grid" class="summary-grid" style="display:none;"></div>
  <div id="status-msg"></div>

  <div id="repo-list" class="repo-list"></div>

  <div id="empty-state" class="empty-state">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
    </svg>
    <p>Enter your token and org to load the dashboard</p>
    <small>Token needs <code style="color:var(--purple)">repo</code> + <code style="color:var(--purple)">read:org</code> scopes</small>
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', loadFromStorage);

const AVATAR_COLORS = [
  ['#1f4b8e','#58a6ff'], ['#0f3d2c','#3fb950'], ['#4a1d0f','#d29922'],
  ['#3b1a45','#bc8cff'], ['#1d3a4a','#56d3f5'], ['#4a2020','#f85149'],
  ['#1a3a2a','#56d364']
];

function initials(name) {
  if (!name) return '?';
  return name.split(/[\s\-_]/).filter(Boolean).map(p => p[0]).join('').toUpperCase().slice(0, 2);
}

function timeAgo(d) {
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 60)     return 'just now';
  if (s < 3600)   return Math.floor(s / 60) + 'm ago';
  if (s < 86400)  return Math.floor(s / 3600) + 'h ago';
  if (s < 604800) return Math.floor(s / 86400) + 'd ago';
  return Math.floor(s / 604800) + 'w ago';
}

function statusBadge(pushedAt) {
  const days = (Date.now() - new Date(pushedAt)) / 86400000;
  if (days < 2)  return `<span class="badge badge-active"><span class="badge-dot"></span>Active</span>`;
  if (days < 7)  return `<span class="badge badge-idle"><span class="badge-dot"></span>Idle</span>`;
  return             `<span class="badge badge-stale"><span class="badge-dot"></span>Stale</span>`;
}

function svg(path, w = 12) {
  return `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
}

const SVG_PR    = svg('<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" y1="9" x2="6" y2="21"/>');
const SVG_ISSUE = svg('<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>');
const SVG_COMMIT= svg('<circle cx="12" cy="12" r="3"/><line x1="3" y1="12" x2="9" y2="12"/><line x1="15" y1="12" x2="21" y2="12"/>');

async function ghFetch(url, token) {
  const r = await fetch(url, {
    headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
  });
  if (!r.ok) throw new Error(`GitHub ${r.status}: ${url.split('/').slice(-2).join('/')}`);
  return r.json();
}

function saveToStorage() {
  const token = document.getElementById('pat-input').value.trim();
  const org   = document.getElementById('org-input').value.trim();
  if (token) localStorage.setItem('gh_pat', token);
  if (org)   localStorage.setItem('gh_org', org);
}

function loadFromStorage() {
  const token = localStorage.getItem('gh_pat');
  const org   = localStorage.getItem('gh_org');
  if (token) document.getElementById('pat-input').value = token;
  if (org)   document.getElementById('org-input').value = org;
  if (token && org) loadDashboard();
}

async function loadDashboard() {
  const token = document.getElementById('pat-input').value.trim();
  const org   = document.getElementById('org-input').value.trim();
  if (!token || !org) { setStatus('↳ enter token and org to continue'); return; }
  saveToStorage();

  const btn = document.getElementById('load-btn');
  btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 0.8s linear infinite"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.18-6.58"/></svg> Loading`;
  btn.disabled = true;

  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('repo-list').innerHTML = '';
  document.getElementById('summary-grid').style.display = 'none';
  setStatus('↳ fetching repositories…');

  try {
    let repos;
    try {
      repos = await ghFetch(`https://api.github.com/orgs/${org}/repos?per_page=30&sort=pushed`, token);
    } catch {
      repos = await ghFetch(`https://api.github.com/users/${org}/repos?per_page=30&sort=pushed`, token);
    }
    if (!repos.length) { setStatus('↳ no repositories found.'); resetBtn(); return; }

    setStatus(`↳ found ${repos.length} repos — loading details…`);

    const details = await Promise.all(repos.map(async (repo, i) => {
      try {
        const [commits, pulls, issues] = await Promise.all([
          ghFetch(`https://api.github.com/repos/${org}/${repo.name}/commits?per_page=1`, token).catch(() => []),
          ghFetch(`https://api.github.com/repos/${org}/${repo.name}/pulls?state=open&per_page=5`, token).catch(() => []),
          ghFetch(`https://api.github.com/repos/${org}/${repo.name}/issues?state=open&per_page=5`, token).catch(() => [])
        ]);
        return { repo, lastCommit: commits[0] || null, pulls, issues: issues.filter(i => !i.pull_request), colorIdx: i % 7 };
      } catch {
        return { repo, lastCommit: null, pulls: [], issues: [], colorIdx: i % 7 };
      }
    }));

    renderSummary(details, org);
    renderCards(details, org);
    setStatus('');
  } catch (e) {
    setStatus('↳ error: ' + e.message);
  }

  resetBtn();
}

function resetBtn() {
  const btn = document.getElementById('load-btn');
  btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.18-6.58"/></svg> Refresh`;
  btn.disabled = false;
}

function setStatus(msg) {
  document.getElementById('status-msg').textContent = msg;
}

function renderSummary(details, org) {
  const totalPRs    = details.reduce((s, d) => s + d.pulls.length, 0);
  const totalIssues = details.reduce((s, d) => s + d.issues.length, 0);
  const active      = details.filter(d => d.repo.pushed_at && (Date.now() - new Date(d.repo.pushed_at)) / 86400000 < 2).length;

  const el = document.getElementById('summary-grid');
  el.style.display = 'grid';
  el.innerHTML = `
    <div class="metric-card">
      <span class="metric-label">Repositories</span>
      <span class="metric-value" style="color:var(--text)">${details.length}</span>
    </div>
    <div class="metric-card">
      <span class="metric-label">Active today</span>
      <span class="metric-value green">${active}</span>
    </div>
    <div class="metric-card">
      <span class="metric-label">Open PRs</span>
      <span class="metric-value blue">${totalPRs}</span>
    </div>
    <div class="metric-card">
      <span class="metric-label">Open Issues</span>
      <span class="metric-value orange">${totalIssues}</span>
    </div>
  `;
}

function renderCards(details, org) {
  const list = document.getElementById('repo-list');
  list.innerHTML = '';

  details.forEach(({ repo, lastCommit, pulls, issues, colorIdx }) => {
    const [avatarBg, avatarFg] = AVATAR_COLORS[colorIdx];
    const committer  = lastCommit?.commit?.author?.name || lastCommit?.author?.login || '—';
    const commitMsg  = lastCommit?.commit?.message?.split('\n')[0] || 'No commits yet';
    const commitTime = lastCommit?.commit?.author?.date ? timeAgo(lastCommit.commit.author.date) : '—';
    const ini        = initials(committer);

    const prRows    = pulls.length
      ? pulls.slice(0, 3).map(p => `<div class="item-line">${SVG_PR}<span style="overflow:hidden;text-overflow:ellipsis">${esc(p.title)}</span></div>`).join('')
      : `<span class="empty-line">No open PRs</span>`;

    const issueRows = issues.length
      ? issues.slice(0, 3).map(i => `<div class="item-line">${SVG_ISSUE}<span style="overflow:hidden;text-overflow:ellipsis">${esc(i.title)}</span></div>`).join('')
      : `<span class="empty-line">No open issues</span>`;

    const card = document.createElement('div');
    card.className = 'repo-card';
    card.innerHTML = `
      <div class="repo-header">
        <div>
          <div class="repo-name-row">
            <svg class="repo-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z" fill="currentColor"/>
            </svg>
            <a class="repo-name" href="${repo.html_url}" target="_blank" rel="noopener">${esc(repo.name)}</a>
          </div>
          ${repo.description ? `<div class="repo-desc">${esc(repo.description)}</div>` : ''}
        </div>
        <div class="repo-meta">
          ${statusBadge(repo.pushed_at)}
          <span class="time-label">${timeAgo(repo.pushed_at)}</span>
        </div>
      </div>

      <div class="repo-details">
        <div class="detail-box">
          <div class="detail-title">${SVG_COMMIT} Last commit</div>
          <div class="commit-row">
            <span class="avatar" style="background:${avatarBg};color:${avatarFg}">${ini}</span>
            <span class="commit-author">${esc(committer)}</span>
            <span class="commit-time">${commitTime}</span>
          </div>
          <div class="commit-msg" title="${esc(commitMsg)}">${esc(commitMsg)}</div>
        </div>

        <div class="detail-box">
          <div class="detail-title">${SVG_PR} Open PRs <span style="color:var(--blue);margin-left:2px">${pulls.length}</span></div>
          ${prRows}
        </div>

        <div class="detail-box">
          <div class="detail-title">${SVG_ISSUE} Issues <span style="color:var(--orange);margin-left:2px">${issues.length}</span></div>
          ${issueRows}
        </div>
      </div>
    `;
    list.appendChild(card);
  });
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>

</body>
</html>
